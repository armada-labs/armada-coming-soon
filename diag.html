<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Hero render diagnostics</title>
  <style>
    html, body { margin: 0; background: #070708; color: #ddd; font: 13px/1.5 ui-monospace, Menlo, monospace; }
    section { position: relative; height: 70vh; overflow: hidden; border-bottom: 1px solid #333; }
    .label { position: absolute; z-index: 2; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; }
    .scene { position: absolute; inset: 0; }
    .scene canvas { width: 100% !important; height: 100% !important; display: block; }
    /* A: exactly what the live hero does on phones */
    #a .scene { left: 50%; top: 50%; width: 600px; height: 800px; transform: translate(-50%, -50%); inset: auto;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%); }
    pre { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <pre id="info">gathering…</pre>
  <section id="a"><div class="label">A · as live hero (600×800, dpi≤3, fps 30, mask)</div><div class="scene" id="sa"></div></section>
  <section id="b"><div class="label">B · plain embed, runtime defaults</div><div class="scene" id="sb"></div></section>
  <section id="c"><div class="label">C · plain embed, dpi = devicePixelRatio</div><div class="scene" id="sc"></div></section>

  <script src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.2.12/dist/unicornStudio.umd.js"></script>
  <script>
    var out = [];
    function log(s) { out.push(s); document.getElementById('info').textContent = out.join('\n'); }
    log('UA: ' + navigator.userAgent);
    log('viewport: ' + window.innerWidth + 'x' + window.innerHeight + '  devicePixelRatio: ' + window.devicePixelRatio);
    log('matches (max-width: 640px): ' + window.matchMedia('(max-width: 640px)').matches);
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl2') || c.getContext('webgl');
      if (gl) {
        var hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
        var mp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.MEDIUM_FLOAT);
        var dbg = gl.getExtension('WEBGL_debug_renderer_info');
        log('webgl: ' + (gl.getParameter(gl.VERSION)) + (dbg ? '  renderer: ' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : ''));
        log('fragment highp precision bits: ' + hp.precision + ' (range ' + hp.rangeMin + '..' + hp.rangeMax + ')   mediump: ' + mp.precision);
        log('MAX_TEXTURE_SIZE: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE) + '  MAX_RENDERBUFFER_SIZE: ' + gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));
      } else { log('webgl: unavailable'); }
    } catch (e) { log('webgl probe failed: ' + e); }

    var file = '/assets/unicorn/contour-mobile-4.json';
    function add(id, opts, name) {
      return UnicornStudio.addScene(Object.assign({ elementId: id, filePath: file, lazyLoad: false, production: true, altText: '', ariaLabel: '' }, opts))
        .then(function () {
          setTimeout(function () {
            var el = document.getElementById(id), cv = el.querySelector('canvas');
            log(name + ': element ' + el.clientWidth + 'x' + el.clientHeight + ' css px, canvas ' + (cv ? cv.width + 'x' + cv.height : 'none') + ' device px');
          }, 800);
        }).catch(function (e) { log(name + ' failed: ' + e); });
    }
    add('sa', { fps: 30, scale: 1, dpi: Math.min(window.devicePixelRatio || 1, 3) }, 'A')
      .then(function () { return add('sb', {}, 'B'); })
      .then(function () { return add('sc', { dpi: window.devicePixelRatio || 1 }, 'C'); });
  </script>
</body>
</html>
